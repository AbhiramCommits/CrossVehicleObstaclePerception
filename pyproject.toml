[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cv-obstacle"
version = "1.0.0"
description = "Cross-vehicle obstacle detection: transfer learning, adversarial domain adaptation and knowledge distillation"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.2",
  "torchvision>=0.17",
  "opencv-python>=4.9",
  "numpy>=1.26",
  "scipy>=1.11",
  "albumentations>=1.4",
  "Pillow>=10.0",
  "pyyaml>=6.0",
  "onnx>=1.15",
  "onnxruntime>=1.17",
  "matplotlib>=3.8",
  "tqdm>=4.66",
]

[tool.setuptools.packages.find]
include = ["cv_obstacle*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::UserWarning",
]
